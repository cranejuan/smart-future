<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>眺望数智未来，科技改变生活</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    background:#1a1f3a;
    min-height:100vh;
}
body{
    display:block;
    margin:0;
    overflow-x:hidden;
}
#page{
    width: 100vw;
    max-width: 100%;
    margin: 0 auto;
    perspective:1200px;
    overflow: hidden;
    position: relative;
}
.top-box{
    width:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.15s ease-out;
    will-change: transform; /* 开启GPU加速 */
}
.top-box > img{
    width:100%;
    height:auto;
    display:block;
    background-color: #1a1f3a; /* 骨架底色 */
}
.title-text{
    position:absolute;
    top:2%;
    left:0;
    width:100%;
    text-align:center;
    color:#fff;
    transform-style: preserve-3d;
    z-index:10;
    pointer-events: none;
}
.title-text h2{
    font-size:clamp(28px,5vw,72px);
    margin-bottom:0.6em;
    text-shadow:2px 2px 8px #000;
    font-weight:bold;
}
.title-text p{
    font-size:clamp(14px,2vw,30px);
    line-height:1.8;
    text-shadow:1px 1px 6px #000;
}
.city-wrap{
    width:96%;
    height:62%;
    position:absolute;
    left:50%;
    top:62%;
    transform:translate(-50%,-50%) translateZ(30px);
    transform-style:preserve-3d;
}
.city-card{
    width:20%;
    position:absolute;
    border-radius:0.8%;
    overflow:hidden;
    box-shadow:0 4px 22px rgba(0,0,0,0.5);
    opacity:1;
    transition:left 1s ease, top 1s ease, z-index 1s ease, transform 1s ease;
    transform-style:preserve-3d;
    z-index:1;
    cursor:pointer;
    background-color: #2a3550; 
    will-change: left, top, transform;
}
.city-card:hover{
    transform:scale(1.1) translateZ(20px) rotateY(3deg);
}
.city-card img{
    width:100%;
    height:auto;
    display:block;
}
.p0{left:6%;top:30%;z-index:2;transform:translateZ(20px);}
.p1{left:40%;top:30%;z-index:3;transform:translateZ(50px);}
.p2{left:74%;top:30%;z-index:2;transform:translateZ(20px);}
.p3{left:22%;top:58%;z-index:10;transform:translateZ(80px);}
.p4{left:58%;top:58%;z-index:10;transform:translateZ(80px);}
.drone{
    position:absolute;
    width:18%;
    top:12%;
    left:69%;
    z-index:15;
    transform-style:preserve-3d;
    animation:droneFloat 3s ease-in-out infinite;
    will-change: transform;
}
.drone > img{
    width:100%;
    height:auto;
    display:block;
    transform:translateZ(130px) rotateY(-6deg) rotateX(4deg);
    filter:drop-shadow(1vw 1.4vw 1.4vw rgba(0,0,0,0.45));
}
.drone-shadow{
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    background:rgba(0,0,0,0.35);
    border-radius:50%;
    transform:translateZ(120px) translateX(1.2vw) translateY(0.8vw) scale(0.95);
    filter:blur(12px);
    opacity:0.6;
}
.tip-text{
    text-align:center;
    color:#fff;
    font-size:clamp(14px,1vw,16px);
    padding: 30px 0 10px;
    letter-spacing:2px;
    opacity:0.85;
}
footer{
    color:#cccccc;
    text-align:center;
    padding: 10px 20px 40px;
    font-size:clamp(11px,0.8vw,13px);
    line-height:1.8;
}
@keyframes droneFloat{
    0%{transform:translateY(0px)}
    50%{transform:translateY(-12px)}
    100%{transform:translateY(0px)}
}

/* ========== 手机端适配 ========== */
@media (max-width:768px){
    html, body {
        height: 100vh;
        overflow: hidden;
        overscroll-behavior: none;
    }
    
    #page {
        width: 100%;
        height: 100%;
        perspective: none;
        overflow: hidden;
    }

    .top-box {
        width: 100%;
        height: 100%;
        transform: none !important; 
    }

    .top-box > img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        z-index: 0;
    }

    .title-text {
        top: 10%;
        padding: 0 14px;
        z-index: 20;
    }
    .title-text h2 {
        font-size: clamp(20px, 5.5vw, 28px);
        margin-bottom: 8px;
    }
    .title-text p {
        font-size: clamp(12px, 3.2vw, 15px);
        line-height: 1.6;
    }

    .drone {
        top: 12%; 
        left: auto;
        right: 6%;
        width: 25%;
        z-index: 25;
    }
    .drone > img {
        transform: none;
        filter: drop-shadow(0 6px 10px rgba(0,0,0,.45));
    }
    .drone-shadow {
        display: none; 
    }

    .city-wrap {
        position: absolute;
        left: 50%;
        bottom: 12vh; 
        top: auto;
        width: 100%;
        height: 45vh;
        transform: translateX(-50%) !important; 
        display: block;
        z-index: 10;
    }

    /* 手机端恢复丝滑的位移动画（图片变小了，带得动了） */
    .city-card {
        position: absolute !important;
        width: 26%; 
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0,0,0,.45);
        transition: left .8s ease, top .8s ease, z-index .8s ease;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        will-change: left, top;
        overflow: hidden; 
    }
    
    .city-card:hover { transform: none; }

    .city-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%; 
        transform: scale(1.15); 
    }

    /* 手机屏幕错落位置 */
    .city-card.p0 { left: 5%;  top: 15%; z-index: 2; }
    .city-card.p1 { left: 37%; top: 15%; z-index: 3; }
    .city-card.p2 { left: 69%; top: 15%; z-index: 2; }
    .city-card.p3 { left: 21%; top: 48%; z-index: 10; }
    .city-card.p4 { left: 53%; top: 48%; z-index: 10; }

    .city-card.p3 {
        box-shadow: 0 4px 16px rgba(0,0,0,.45);
    }
    
    .tip-text, footer {
        display: none; 
    }
}

@media (min-width:560px) and (max-width:768px){
    .city-card { width: 22%; }
    .city-card.p0 { left: 8%; top: 15%; }
    .city-card.p1 { left: 39%; top: 15%; }
    .city-card.p2 { left: 70%; top: 15%; }
    .city-card.p3 { left: 23%; top: 50%; }
    .city-card.p4 { left: 55%; top: 50%; }
}
</style>
</head>
<body>
<div id="page">
    <div class="top-box">
        <!-- 记得确认这里图片的后缀名对不对（.jpg 还是 .webp） -->
        <img src="img/sy.jpg" alt="背景" decoding="async" fetchpriority="high">
        
        <div class="drone" onclick="location.href='time.html'" title="点击进入时光记忆墙">
            <div class="drone-shadow"></div>
            <img src="img/drone.png" alt="无人机" decoding="async">
        </div>
        
        <div class="title-text">
            <h2>眺望数智未来，科技改变生活</h2>
            <p>人工智能与大数据赋能城市发展<br>感受时代变迁，拥抱数字新生活</p>
        </div>
        
        <div class="city-wrap">
            <div class="city-card p0" onclick="location.href='shanghai.html'"><img src="img/sh.jpg" decoding="async" alt="上海"></div>
            <div class="city-card p1" onclick="location.href='shenzhen.html'"><img src="img/sz.jpg" decoding="async" alt="深圳"></div>
            <div class="city-card p2" onclick="location.href='guizhou.html'"><img src="img/gz.png" decoding="async" alt="贵州"></div>
            <div class="city-card p4" onclick="location.href='chengdu.html'"><img src="img/cd.jpg" decoding="async" alt="成都"></div>
            <div class="city-card p3" onclick="location.href='hangzhou.html'"><img src="img/hz.jpg" decoding="async" alt="杭州"></div>
        </div>
    </div>
    <p class="tip-text">— 点击城市卡片，探索数智城市 —</p>
    <footer>
        作品名称：眺望数智未来，科技改变生活<br>
        本作品为H5网页科普展示；图片、视频素材仅用于参赛演示，不作商业用途。<br>
        注：子页面中图表数据为模拟演示数据，仅用于科普展示。
    </footer>
</div>
<script>
const topBox = document.querySelector('.top-box');
const pageDom = document.querySelector('#page');
const isMobile = () => window.matchMedia('(max-width:768px)').matches;

/* =========================================
   电脑端专属：鼠标 3D 视差
   ========================================= */
pageDom.addEventListener('mousemove', e => {
    if(isMobile()) return;
    const x = e.clientX / window.innerWidth - 0.5;
    const y = e.clientY / window.innerHeight - 0.5;
    topBox.style.transform = `rotateY(${x*4}deg) rotateX(${-y*4}deg)`;
});
pageDom.addEventListener('mouseleave', () => {
    if(isMobile()) return;
    topBox.style.transform = `rotateY(0deg) rotateX(0deg)`;
});

/* =========================================
   卡片轮换动画 (电脑手机都开启，因为图片变小了)
   ========================================= */
const route = ["p0","p1","p2","p4","p3"];
const cards = document.querySelectorAll('.city-card');
let step = 0;

// 移除之前的 isMobile 拦截，现在手机端也能流畅轮播了
setTimeout(()=>{
    setInterval(()=>{
        cards.forEach(card=>{
            card.classList.remove("p0","p1","p2","p3","p4");
        });
        for(let i=0;i<5;i++){
            const posIndex=(i+step)%5;
            cards[i].classList.add(route[posIndex]);
        }
        step++;
    }, 4000);
}, 2000);
</script>
</body>
</html>
