<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>苏州河 · 连接传统与未来</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    padding: 0;
    background: transparent;
}


/* 外层卡片 */
.river-card {
    width: 100%;
    border-radius: 22px;
    padding: 36px 24px 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    position: relative;
    overflow: hidden;
    background: transparent;
    box-shadow: none;
}

/* 标题气泡：浅米色，更柔和自然 */
.title-bubble {
    position: absolute;
    left: 50%;
    top: 12px;
    transform: translateX(-50%);
    background: rgba(247, 241, 230, 0.72);
    padding: 8px 22px;
    border-radius: 99px;
    font-size: 16px;
    color: #443b30;
    font-weight: 600;
    backdrop-filter: blur(4px);
    box-shadow: 0 2px 8px rgba(120, 95, 70, 0.06);
    z-index: 5;
    white-space: nowrap;
}

/* 标题背景缓慢呼吸变化 */
@keyframes titleBreathe {
    0%, 100% {
        background: rgba(247, 241, 230, 0.72);
    }
    50% {
        background: rgba(234, 241, 248, 0.72);
    }
}
.title-bubble{
    animation: titleBreathe 7s infinite ease-in-out;
}

/* 左侧传统上海 */
.card-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
}

.icon-old {
    width: 54px;
    height: 54px;
    background: #c8a877;
    border-radius: 14px;
    position: relative;
    box-shadow: 0 2px 8px rgba(145, 78, 67, 0.25);
    animation: oldFade 6s infinite ease-in-out;
}

.icon-old::before {
    content: "";
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 26px;
    background: #914E43;
    border-radius: 4px 4px 0 0;
}

.icon-old::after {
    content: "";
    position: absolute;
    bottom: 6px;
    left: 8px;
    right: 8px;
    height: 7px;
    background: #914E43;
    border-radius: 2px;
}

.text-left {
    font-size: 14px;
    color: #333;
    font-weight: 500;
    animation: textFade 6s infinite ease-in-out;
}

/* 传统碎片 */
.old-particle {
    position: absolute;
    width: 7px;
    height: 7px;
    background: #914E43;
    border-radius: 2px;
    top: 30px;
    left: 50%;
    opacity: 0;
    animation: oldBreakaway 6s infinite ease-in-out;
}

.op1 { animation-delay: 0s; }
.op2 { animation-delay: 0.6s; }
.op3 { animation-delay: 1.2s; }
.op4 { animation-delay: 1.8s; }

/* 中间苏州河区域 */
.card-middle {
    flex: 1;
    height: 90px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 苏州河河面 */
.suzhou-creek {
    position: absolute;
    left: 0;
    right: 0;
    top: 55%;
    transform: translateY(-50%);
    height: 42px;
    border-radius: 21px;
    background: linear-gradient(180deg,
        rgba(170, 190, 186, 0.4),
        rgba(130, 155, 148, 0.55),
        rgba(160, 182, 176, 0.4));
    overflow: hidden;
}

/* 河水渐变 */
.river-water {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    background: linear-gradient(90deg,
        rgba(145, 78, 67, 0.18),
        rgba(180, 170, 140, 0.12) 30%,
        rgba(150, 180, 210, 0.18) 70%,
        rgba(48, 75, 140, 0.22));
}

/* 水波 */
.river-waves {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
}

.wave-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg,
        transparent,
        rgba(255, 255, 255, 0.45),
        transparent);
    animation: waveMove 7s infinite linear;
}

.w1 { top: 28%; animation-duration: 6s; }
.w2 { top: 50%; animation-duration: 7s; animation-delay: -2s; }
.w3 { top: 72%; animation-duration: 8s; animation-delay: -4s; }

/* 转化粒子 */
.transform-particle {
    position: absolute;
    top: 50%;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    animation: transformFlow 5s infinite linear;
}

.transform-particle.tp1 { left: 6%; animation-delay: 0s; }
.transform-particle.tp2 { left: 18%; animation-delay: 0.9s; }
.transform-particle.tp3 { left: 30%; animation-delay: 1.8s; }
.transform-particle.tp4 { left: 42%; animation-delay: 2.7s; }
.transform-particle.tp5 { left: 54%; animation-delay: 3.6s; }

/* 游船光点 */
.boat-dot {
    position: absolute;
    top: 50%;
    width: 10px;
    height: 5px;
    background: #f6f9fc;
    border-radius: 2px 5px 2px 2px;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
    animation: boatSail 6s infinite linear;
}

.b1 { left: 10%; animation-delay: 0s; }
.b2 { left: 20%; animation-delay: 2.5s; }

/* 两端节点 */
.node {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    position: absolute;
    top: 55%;
    transform: translateY(-50%);
    z-index: 3;
}

.node-left {
    left: 4px;
    background: #914E43;
    box-shadow: 0 0 12px rgba(145, 78, 67, 0.65);
}

.node-right {
    right: 4px;
    background: #304b8c;
    box-shadow: 0 0 12px rgba(48, 75, 140, 0.65);
}

/* 右侧智慧上海 */
.card-right {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
}

.icon-smart {
    width: 54px;
    height: 54px;
    background: linear-gradient(135deg, #304b8c, #5f7ab5);
    border-radius: 14px;
    position: relative;
    box-shadow: 0 2px 10px rgba(48, 75, 140, 0.35);
    animation: smartGlow 6s infinite ease-in-out;
}

.icon-smart::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 50%;
    animation: pulse 2s infinite ease-in-out;
}

.icon-smart::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 9px;
    height: 9px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 10px #ffffff;
}

.smart-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px dashed rgba(48, 75, 140, 0.45);
    animation: smartRing 6s infinite ease-in-out;
}

.smart-particle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #304b8c;
    border-radius: 50%;
    right: 20px;
    top: 26px;
    opacity: 0;
    animation: smartReceive 6s infinite ease-in-out;
}

.sp1 { animation-delay: 0.5s; }
.sp2 { animation-delay: 1.3s; }
.sp3 { animation-delay: 2.1s; }

.text-right {
    font-size: 14px;
    color: #333;
    font-weight: 500;
    animation: textGlow 6s infinite ease-in-out;
}

/* 动画 */
@keyframes waveMove {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

@keyframes boatSail {
    0% { left: 8%; opacity: 0; transform: translateY(-50%) scale(0.8); }
    12% { opacity: 1; }
    88% { opacity: 1; }
    100% { left: 92%; opacity: 0; transform: translateY(-50%) scale(1); }
}

@keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
}

@keyframes oldFade {
    0%, 90%, 100% { opacity: 1; transform: scale(1); filter: blur(0); }
    30% { opacity: 0.9; transform: scale(0.97); filter: blur(0.3px); }
    60% { opacity: 0.5; transform: scale(0.93); filter: blur(0.8px); }
}

@keyframes textFade {
    0%, 90%, 100% { opacity: 1; }
    40% { opacity: 0.7; }
    70% { opacity: 0.35; }
}

@keyframes oldBreakaway {
    0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
    20% { opacity: 1; }
    50% { transform: translate(80px, -20px) scale(0.9); }
    80% { opacity: 0.6; transform: translate(160px, 10px) scale(0.7); }
    100% { opacity: 0; transform: translate(220px, -10px) scale(0.4); }
}

@keyframes transformFlow {
    0% {
        left: 6%;
        opacity: 0;
        transform: translateY(-50%) scale(0.6);
        background: radial-gradient(circle at 30% 30%, #fff, #914E43 40%, #6b362c);
        box-shadow: 0 0 10px rgba(145, 78, 67, 0.7);
    }
    20% { opacity: 1; }
    50% {
        background: radial-gradient(circle at 30% 30%, #fff, #b5a57a 40%, #8a7a4e);
        box-shadow: 0 0 10px rgba(180, 160, 110, 0.6);
    }
    80% {
        background: radial-gradient(circle at 30% 30%, #fff, #6f97c7 40%, #456fa0);
        box-shadow: 0 0 10px rgba(90, 130, 180, 0.7);
    }
    100% {
        left: 94%;
        opacity: 0;
        transform: translateY(-50%) scale(1.1);
        background: radial-gradient(circle at 30% 30%, #fff, #304b8c 40%, #1d2f5c);
        box-shadow: 0 0 10px rgba(48, 75, 140, 0.8);
    }
}

@keyframes smartGlow {
    0%, 10% { opacity: 0.75; transform: scale(1); box-shadow: 0 2px 10px rgba(48, 75, 140, 0.35); }
    40% { opacity: 0.9; transform: scale(1.04); box-shadow: 0 0 22px rgba(90, 130, 180, 0.55); }
    70% { opacity: 1; transform: scale(1.08); box-shadow: 0 0 32px rgba(48, 75, 140, 0.8); }
    100% { opacity: 1; transform: scale(1.06); box-shadow: 0 0 28px rgba(48, 75, 140, 0.75); }
}

@keyframes textGlow {
    0%, 20% { opacity: 0.6; }
    50% { opacity: 0.9; }
    100% { opacity: 1; }
}

@keyframes smartRing {
    0% { opacity: 0; transform: rotate(0deg) scale(0.9); }
    30% { opacity: 0.6; }
    100% { opacity: 0; transform: rotate(360deg) scale(1.2); }
}

@keyframes smartReceive {
    0% { opacity: 0; transform: translate(-40px, 0) scale(0.6); }
    40% { opacity: 0; }
    60% { opacity: 1; transform: translate(-10px, -8px) scale(1); }
    80% { opacity: 0.8; transform: translate(0, 0) scale(1.1); }
    100% { opacity: 0; transform: translate(6px, 4px) scale(0.7); }
}

@media (max-width: 768px) {
    .river-card {
        padding: 32px 16px 16px;
        gap: 10px;
    }

    .icon-old,
    .icon-smart {
        width: 44px;
        height: 44px;
    }

    .card-middle {
        height: 74px;
    }

    .suzhou-creek {
        height: 36px;
    }

    .title-bubble {
        font-size: 14px;
        padding: 7px 16px;
    }
}
</style>
</head>

<body>
<div class="river-card">
    <!-- 标题气泡：在卡片顶部，浅米色半透 -->
    <div class="title-bubble">苏州河 · 连接传统与未来</div>

    <!-- 左侧：传统上海 -->
    <div class="card-left">
        <div class="icon-old"></div>
        <div class="old-particle op1"></div>
        <div class="old-particle op2"></div>
        <div class="old-particle op3"></div>
        <div class="old-particle op4"></div>
        <div class="text-left">传统上海</div>
    </div>

    <!-- 中间：苏州河 -->
    <div class="card-middle">
        <div class="suzhou-creek">
            <div class="river-water"></div>
            <div class="river-waves">
                <div class="wave-line w1"></div>
                <div class="wave-line w2"></div>
                <div class="wave-line w3"></div>
            </div>
            <div class="transform-particle tp1"></div>
            <div class="transform-particle tp2"></div>
            <div class="transform-particle tp3"></div>
            <div class="transform-particle tp4"></div>
            <div class="transform-particle tp5"></div>
            <div class="boat-dot b1"></div>
            <div class="boat-dot b2"></div>
        </div>

        <div class="node node-left"></div>
        <div class="node node-right"></div>
    </div>

    <!-- 右侧：智慧上海 -->
    <div class="card-right">
        <div class="icon-smart">
            <div class="smart-ring"></div>
        </div>
        <div class="smart-particle sp1"></div>
        <div class="smart-particle sp2"></div>
        <div class="smart-particle sp3"></div>
        <div class="text-right">智慧上海</div>
    </div>
</div>
</body>
</html>
